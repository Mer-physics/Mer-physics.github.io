  <h1>熱力学第二法則の同値性</h1>

  <p>
    熱力学では，系が十分ゆっくりと変化し，その各瞬間で平衡状態にあるとみなせる過程を準静過程という。
  </p>

  <p>
    たとえば，気体の圧力を \(p\)，体積を \(V\) とすると，準静過程において気体が外界にする仕事は
  </p>

  \[
    W = \int p\,dV
  \]

  <p>
    と表される。この式が意味をもつためには，各瞬間の圧力 \(p\) が熱力学的状態量として定まっている必要がある。
  </p>

  <h2>準静過程が必要な理由</h2>

  <p>
    非平衡な変化では，系内部の圧力や温度が一様とは限らない。そのため，単純に状態量 \(p,V,T\) だけで過程を記述することが難しくなる。
  </p>
